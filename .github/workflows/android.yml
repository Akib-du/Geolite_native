name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: geolite-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build GDAL Android engine with GPX and OpenFileGDB
        run: |
          git clone --depth 1 https://github.com/kikitte/GDAL4Android.git vendor/GDAL4Android
          python3 - <<'PY'
          from pathlib import Path
          script = Path("vendor/GDAL4Android/gdal/build_cpp.sh")
          source = script.read_text()
          needle = "   -DOGR_BUILD_OPTIONAL_DRIVERS=OFF \\\n"
          extra = (
              needle
              + "   -DOGR_ENABLE_DRIVER_GPX=ON \\\n"
              + "   -DOGR_ENABLE_DRIVER_OPENFILEGDB=ON \\\n"
              + "   -DGDAL_ENABLE_DRIVER_PNG=ON \\\n"
          )
          if needle not in source:
              raise SystemExit("Could not find GDAL CMake driver configuration line")
          script.write_text(source.replace(needle, extra, 1))
          PY
          docker build -t geolite-gdal-builder - < vendor/GDAL4Android/docker/Dockerfile
          docker run --rm --platform linux/amd64 \
            -v "$PWD/vendor/GDAL4Android:/root/GDAL4Android" \
            geolite-gdal-builder bash -lc "yes | /root/android_sdk/cmdline-tools/bin/sdkmanager --sdk_root=/root/android_sdk \"platforms;android-33\" \"build-tools;33.0.2\" \"platform-tools\" >/dev/null && cp /root/GDAL4Android/docker/cmake_modules/FindJNI.cmake /usr/share/cmake-3.22/Modules/FindJNI.cmake && cd /root/GDAL4Android && ./gradlew gdal:assembleRelease"
          mkdir -p app/libs
          cp vendor/GDAL4Android/gdal/build/outputs/aar/gdal-release.aar app/libs/gdal-3.7.0.aar
          test -s app/libs/gdal-3.7.0.aar
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GeoLite-Native-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
