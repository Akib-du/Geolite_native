name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Download Android GDAL engine (GDAL 3.7.0 / PROJ 9.2.1)
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 https://github.com/kikitte/GDAL4Android/releases/download/v3.7.0-iconv/gdal-3.7.0.aar --output app/libs/gdal-3.7.0.aar
          test -s app/libs/gdal-3.7.0.aar
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GeoLite-Native-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
